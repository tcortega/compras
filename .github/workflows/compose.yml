name: compose

on:
  push:
  pull_request:

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stack
        working-directory: infra
        run: docker compose up --build --wait --detach --wait-timeout 1800
      - name: Prove served API and web
        working-directory: infra
        run: python3 prove.py
      - name: Logs
        if: failure()
        working-directory: infra
        run: docker compose logs
