name: e2e

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: compras
          POSTGRES_PASSWORD: compras
          POSTGRES_DB: compras
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compras -d compras"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_DB: compras
          CLICKHOUSE_USER: compras
          CLICKHOUSE_PASSWORD: compras
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user compras --password compras --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline
        run: pip install -e ingest
      - name: E2E fixture in, parquet and rows out
        env:
          POSTGRES_DSN: postgresql://compras:compras@127.0.0.1:5432/compras
          CLICKHOUSE_URL: http://127.0.0.1:8123
          CLICKHOUSE_USER: compras
          CLICKHOUSE_PASSWORD: compras
          CLICKHOUSE_DATABASE: compras
          LANDING_URI: ${{ github.workspace }}/.e2e-landing
        run: python -m compras_ingest.e2e
