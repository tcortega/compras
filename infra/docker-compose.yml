name: compras

x-dagster-env: &dagster-env
  DAGSTER_HOME: /opt/dagster/home
  DAGSTER_PG_HOST: postgres
  DAGSTER_PG_PORT: "5432"
  DAGSTER_PG_USER: ${POSTGRES_USER:-compras}
  DAGSTER_PG_PASSWORD: ${POSTGRES_PASSWORD:-compras}
  DAGSTER_PG_DB: dagster
  POSTGRES_DSN: postgresql://${POSTGRES_USER:-compras}:${POSTGRES_PASSWORD:-compras}@postgres:5432/${POSTGRES_DB:-compras}
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-compras}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-compras}
  CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-compras}
  AWS_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-landing}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-landing-secret}
  AWS_DEFAULT_REGION: us-east-1
  LANDING_URI: s3://compras-landing
  METHODOLOGY_VERSION: ${METHODOLOGY_VERSION:-phase1-0.1.0}
  COMPRAS_GOV_DIR: /app/ingest/fixtures/compras_gov
  CATALOGO_CNBS_DIR: /app/ingest/fixtures/catalogo_cnbs
  RECEITA_CNPJ_PATH: /app/ingest/fixtures/receita_cnpj
  OCDS_PATH: /app/ingest/fixtures/ocds/releases.jsonl
  SANCTIONS_DIR: /app/ingest/fixtures/sanctions
  PNCP_CONSULTA_DIR: /app/ingest/fixtures/pncp_consulta
  TCE_SP_PATH: /app/ingest/fixtures/tce_sp_licitacao
  TCE_RS_PATH: /app/ingest/fixtures/tce_rs_licitacon

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-compras}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compras}
      POSTGRES_DB: ${POSTGRES_DB:-compras}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/01_compras.sql:/docker-entrypoint-initdb.d/01_compras.sql:ro
      - ./postgres/02_dagster.sh:/docker-entrypoint-initdb.d/02_dagster.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-compras} -d ${POSTGRES_DB:-compras} && psql -U ${POSTGRES_USER:-compras} -d ${DAGSTER_PG_DB:-dagster} -c 'SELECT 1' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [compras]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-compras}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-compras}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-compras}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9009:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse/01_item_fact.sql:/docker-entrypoint-initdb.d/01_item_fact.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user \"$${CLICKHOUSE_USER:-compras}\" --password \"$${CLICKHOUSE_PASSWORD:-compras}\" --query 'SELECT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [compras]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-landing}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-landing-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [compras]

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-landing}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-landing-secret}
    volumes:
      - ./minio/create-bucket.sh:/create-bucket.sh:ro
    entrypoint: ["/bin/sh", "/create-bucket.sh"]
    restart: "no"
    networks: [compras]

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-meili-master-key-32chars-ok}
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [compras]

  dagster-webserver:
    build:
      context: ..
      dockerfile: ingest/Dockerfile
    restart: unless-stopped
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/app/ingest/workspace.yaml"]
    environment:
      <<: *dagster-env
    ports:
      - "3000:3000"
    volumes:
      - dagster_home:/opt/dagster/home
      - ../ingest:/app/ingest
      - ../normalize:/app/normalize
      - ../detect:/app/detect
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/server_info >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 45s
    networks: [compras]

  dagster-daemon:
    build:
      context: ..
      dockerfile: ingest/Dockerfile
    restart: unless-stopped
    command: ["dagster-daemon", "run"]
    environment:
      <<: *dagster-env
    volumes:
      - dagster_home:/opt/dagster/home
      - ../ingest:/app/ingest
      - ../normalize:/app/normalize
      - ../detect:/app/detect
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [compras]

  warehouse-seed:
    build:
      context: ..
      dockerfile: ingest/Dockerfile
    command: ["python", "-m", "compras_ingest.seed"]
    environment:
      <<: *dagster-env
    volumes:
      - ../ingest:/app/ingest
      - ../normalize:/app/normalize
      - ../detect:/app/detect
      - ../infra:/app/infra
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"
    networks: [compras]

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Compras: Host=postgres;Port=5432;Database=${POSTGRES_DB:-compras};Username=${POSTGRES_USER:-compras};Password=${POSTGRES_PASSWORD:-compras}
      App__Host: 0.0.0.0
      App__Port: "5080"
      App__MethodologyVersion: ${METHODOLOGY_VERSION:-phase1-0.1.0}
      App__ApplyMigrations: "false"
    ports:
      - "5080:5080"
    depends_on:
      postgres:
        condition: service_healthy
      warehouse-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5080/api/orgaos?skip=0&take=1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [compras]

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:5080
      SKIP_STATIC_PARAMS: "1"
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "3100:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [compras]

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  meili_data:
  dagster_home:

networks:
  compras:
    driver: bridge
