[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compras-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
description = "Phase 1 ingest, normalize, and Tier 1 detect for compras."
dependencies = [
    "dagster>=1.9.0,<2",
    "dagster-webserver>=1.9.0,<2",
    "dagster-postgres>=0.25.0,<0.30",
    "dagster-aws>=0.25.0,<0.30",
    "polars>=1.10.0",
    "pyarrow>=17.0.0",
    "psycopg[binary]>=3.2.0",
    "clickhouse-connect>=0.8.0",
    "boto3>=1.35.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
compras-e2e = "compras_ingest.e2e:main"
compras-seed = "compras_ingest.seed:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [".", "../normalize", "../detect"]
include = ["compras_ingest*", "compras_normalize*", "compras_detect*"]

[tool.setuptools.package-data]
compras_normalize = ["data/*.csv"]
